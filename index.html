<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seafoodzineclub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background: #f9f9f9;
      color: #222;
    }
    header {
      padding: 80px 40px 40px;
      max-width: 800px;
      margin: 0 auto;
    }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p { margin-top: 12px; color: #666; font-size: 1rem; line-height: 1.7; }
    .sns {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    .sns a {
      text-decoration: none;
      color: #222;
      border: 1px solid #222;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .sns a:hover { background: #222; color: #fff; }
    section {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 40px;
    }
    section h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 24px;
    }
    .card h3 { font-size: 1rem; font-weight: 600; }
    .card p { margin-top: 8px; color: #888; font-size: 0.9rem; }
    footer {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 0.8rem;
    }
  </style>
</head>

</html>
